[project]
name = "neuron"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<51",
    "falkordb>=1.7.1",
    "fastapi>=0.116,<1",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "pydantic>=2.13,<3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "tiktoken>=0.9,<1",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connectors", "graph", "util"]
