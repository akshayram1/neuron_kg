[project]
name = "neuron"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=45,<51",
    "falkordb>=1.7.1",
    "fastapi>=0.116,<1",
    "httpx>=0.28.1",
    "openai>=3.6.0",
    "pgvector>=0.4,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.13,<3",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "tiktoken>=0.9,<1",
    # Code parsing. Keep every version exact: grammar wheels are compiled
    # against a specific tree-sitter ABI; mismatches fail at Language()
    # construction at runtime, not while installing.
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-c==0.24.2",
    "tree-sitter-cpp==0.23.4",
    "tree-sitter-c-sharp==0.23.5",
    "tree-sitter-java==0.23.5",
    "tree-sitter-kotlin==1.1.0",
    "tree-sitter-scala==0.26.2",
    "tree-sitter-groovy==0.1.2",
    "tree-sitter-go==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-ruby==0.23.1",
    "tree-sitter-php==0.24.1",
    "tree-sitter-swift==0.7.3",
    "tree-sitter-dart==0.1.0",
    "tree-sitter-lua==0.5.0",
    "uvicorn[standard]>=0.35,<1",
    "laya>=0.3.20",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["connectors", "graph", "storage", "util"]
